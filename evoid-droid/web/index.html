<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evoid Droid — Excess &amp; Portal Process</title>
  <style>
    :root {
      --bg: #000;
      --fg: #c9b8c9;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 ui-monospace, Menlo, monospace;
      overflow: hidden;
    }
    #screen {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
    #start {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    #hud {
      position: fixed;
      top: 8px;
      left: 8px;
      opacity: 0.6;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="screen" width="1280" height="720"></canvas>
  <div id="start" role="button"></div>
  <div id="hud" hidden></div>
  <audio id="music" preload="auto"></audio>
  <script type="module" src="src/main.js"></script>
</body>
</html>
