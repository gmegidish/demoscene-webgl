<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evoid Droid — Excess &amp; Portal Process</title>
  <style>
    :root {
      --bg: #000;
      --fg: #c9b8c9;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 ui-monospace, Menlo, monospace;
      overflow: hidden;
    }
    #screen {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
    #start {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      cursor: pointer;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    #progress {
      width: 240px;
      height: 2px;
      background: rgba(201, 184, 201, 0.2);
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: var(--fg);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 150ms ease-out;
    }
    #hint {
      font-size: 11px;
      opacity: 0.5;
    }
    #hud {
      position: fixed;
      top: 8px;
      left: 8px;
      opacity: 0.6;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="screen" width="1280" height="720"></canvas>
  <div id="start" role="button">
    <div id="status">loading 0%</div>
    <div id="progress" role="progressbar" aria-label="Loading assets" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div>
    <div id="hint">F — fullscreen</div>
  </div>
  <div id="hud" hidden></div>
  <audio id="music" preload="auto"></audio>
  <script type="module" src="src/main.js"></script>
</body>
</html>
